name: Feature request
description: Suggest a capability or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
