name: Publish image

# Publishes ghcr.io/truespar/sentio, and the GitHub Release, for a v* tag.
#
# Deliberately NOT on pushes to main. `latest` has to mean "latest release",
# otherwise `docker compose up -d` hands a first-time user whatever landed on
# main an hour ago. Pushes to main are validated by ci.yml, which builds the
# image without pushing it.
#
# Each architecture is built on a native runner and merged into one manifest
# afterwards: cross-building arm64 under QEMU turns a Rust release build into
# an hour-plus job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialise releases, but never cancel one. A half-published release leaves a
# manifest without its binaries, so a later tag waits rather than killing it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Sanitise platform for artifact naming
        id: prep
        run: echo "arch=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the merge job attaches the human-readable tags.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.prep.outputs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  windows-binary:
    name: build windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # aws-lc-sys, the C crypto behind rustls, assembles with NASM on MSVC.
      - uses: ilammy/setup-nasm@v1

      - name: Build
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release -p sentio-smtp -p sentio-mcp --bins

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $docs = @("LICENSE", "LICENSE-MIT", "LICENSE-APACHE", "THIRD-PARTY-NOTICES.md", "README.md")
          New-Item -ItemType Directory -Path dist | Out-Null
          # Two archives rather than one: an MCP client only needs sentio-mcp,
          # and a mail server operator only needs sentio-smtp.
          foreach ($bin in @("sentio-smtp", "sentio-mcp")) {
            $stage = "stage-$bin"
            New-Item -ItemType Directory -Path $stage | Out-Null
            Copy-Item "target/release/$bin.exe" $stage/
            Copy-Item $docs $stage/
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$bin-$version-x86_64-pc-windows-msvc.zip"
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          # latest=auto adds :latest for a release tag but not a prerelease,
          # so v1.0.0 moves it and v1.1.0-rc1 does not.
          flavor: |
            latest=auto

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  release:
    name: github release
    needs: [merge, windows-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      packages: read      # pull the image we just published
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The binaries are lifted out of the images built above rather than
      # compiled again. That avoids a second pair of ten-minute release builds,
      # and it guarantees the tarball contains the same bytes the container
      # runs. `docker create` never executes anything, so a foreign-arch image
      # can be unpacked on this runner without emulation.
      - name: Extract binaries from the published images
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMG="${REGISTRY}/${IMAGE}:${VERSION}"
          mkdir -p dist
          for pair in "linux/amd64:x86_64-unknown-linux-gnu" "linux/arm64:aarch64-unknown-linux-gnu"; do
            platform="${pair%%:*}"; triple="${pair##*:}"
            cid=$(docker create --platform "$platform" "$IMG")
            for bin in sentio-smtp sentio-mcp; do
              docker cp "$cid:/usr/local/bin/$bin" "$bin"
              tar -czf "dist/${bin}-${VERSION}-${triple}.tar.gz" \
                  "$bin" LICENSE LICENSE-MIT LICENSE-APACHE \
                  THIRD-PARTY-NOTICES.md README.md
              rm "$bin"
            done
            docker rm -v "$cid" >/dev/null
          done
          ls -la dist

      # The Windows binary is a real cargo build on a Windows runner; it cannot
      # come out of the Linux images like the other two.
      - uses: actions/download-artifact@v8
        with:
          name: windows-binary
          path: dist

      - name: Checksum everything together
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS
          ( cd dist && sha256sum * > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Run it"
            echo
            echo '```bash'
            echo "docker run --rm ${REGISTRY}/${IMAGE}:${VERSION} --help"
            echo '```'
            echo
            echo "Or the full stack, which brings up PostgreSQL, Redis, NATS,"
            echo "MinIO, ClamAV and rspamd alongside it:"
            echo
            echo '```bash'
            echo "git clone https://github.com/${IMAGE}.git && cd sentio"
            echo "git checkout ${GITHUB_REF_NAME}"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "**Image** \`${REGISTRY}/${IMAGE}:${VERSION}\` - linux/amd64, linux/arm64"
            echo
            echo "## Binaries"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Linux x86_64 | \`sentio-smtp-${VERSION}-x86_64-unknown-linux-gnu.tar.gz\` |"
            echo "| Linux aarch64 | \`sentio-smtp-${VERSION}-aarch64-unknown-linux-gnu.tar.gz\` |"
            echo "| Windows x86_64 | \`sentio-smtp-${VERSION}-x86_64-pc-windows-msvc.zip\` |"
            echo
            echo "\`sentio-mcp\`, the MCP server that gives agents email as tools,"
            echo "ships as its own archive for the same three platforms:"
            echo "\`sentio-mcp-${VERSION}-<platform>\`. It needs no database of its"
            echo "own - point it at a running Sentio with SENTIO_BASE_URL and"
            echo "SENTIO_API_KEY."
            echo
            echo "The Linux builds are dynamically linked and need glibc 2.34 or"
            echo "newer - Debian 12+, Ubuntu 22.04+, RHEL 9+. Binding port 25 as a"
            echo "non-root user needs the capability rather than root:"
            echo
            echo '```bash'
            echo "sudo setcap 'cap_net_bind_service=+ep' /usr/local/bin/sentio-smtp"
            echo '```'
            echo
            echo "Windows has no privileged-port restriction, so no equivalent step"
            echo "is needed there. Linux is the supported deployment target and is"
            echo "what the container image and CI exercise; the Windows build is"
            echo "compiled and published but not run in CI."
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "## Changes"
            echo
            echo "See [CHANGELOG.md](https://github.com/${IMAGE}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
