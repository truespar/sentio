# Sentio OSS quickstart - NATS with JetStream enabled.
# Volume-mounted from docker/nats/ so users can tweak without rebuilding.

port: 4222
http_port: 8222

server_name: sentio-nats

max_payload: 8MB

jetstream {
    store_dir: "/data"
    max_memory_store: 256MB
    max_file_store:   8GB
}

# No auth in the compose stack - NATS is only reachable on the internal
# docker network. In production, add users/nkeys or use TLS + credentials.
