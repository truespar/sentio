[Unit]
# rspamd stores history, ratelimit and replies state in Redis. The
# packaged rspamd.service unit only orders itself After=nss-lookup and
# network-online, so without this drop-in rspamd and redis-server can
# start in parallel at boot - rspamd's first Redis connection attempts
# then fail (auto-reconnect recovers within seconds, but it's noise in
# the boot log).
After=redis-server.service
Wants=redis-server.service
