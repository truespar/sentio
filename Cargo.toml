[workspace]
members = [
    "crates/sentio-core",
    "crates/sentio-smtp-server",
    "crates/sentio-smtp-client",
    "crates/sentio-auth",
    "crates/sentio-queue",
    "crates/sentio-api",
    "crates/sentio-webhooks",
    "crates/sentio-llm",
    "crates/sentio-spam",
    "crates/sentio-abuse",
    "crates/sentio-storage",
    "crates/sentio-store",
    "crates/sentio-observe",
    "crates/sentio-mcp",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Truespar Team"]
license = "MIT OR Apache-2.0"
publish = false

[package]
name = "sentio-smtp"
description = "Multi-tenant SMTP platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sentio-smtp"
path = "src/main.rs"

[dependencies]
sentio-core = { path = "crates/sentio-core" }
sentio-smtp-server = { path = "crates/sentio-smtp-server" }
sentio-smtp-client = { path = "crates/sentio-smtp-client" }
sentio-auth = { path = "crates/sentio-auth" }
sentio-queue = { path = "crates/sentio-queue" }
sentio-api = { path = "crates/sentio-api" }
sentio-webhooks = { path = "crates/sentio-webhooks" }
sentio-llm = { path = "crates/sentio-llm" }
sentio-spam = { path = "crates/sentio-spam" }
sentio-abuse = { path = "crates/sentio-abuse" }
sentio-storage = { path = "crates/sentio-storage" }
sentio-store = { path = "crates/sentio-store" }
sentio-observe = { path = "crates/sentio-observe" }
tokio.workspace = true
clap.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hickory-resolver.workspace = true
rustls.workspace = true

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# TLS
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tokio-rustls = "0.26"
webpki-roots = "1"

# Email parsing and auth
mail-parser = "1.0.0"
# default drops "report": it is DMARC aggregate report parsing, which pulls in
# zip, and three RUSTSEC advisories stand against the zip 8 line that mail-auth
# pins (2026-0367, -0368, -0369) with no fix below zip 9. We verify DKIM, SPF,
# DMARC and ARC and never extract an archive, so the feature was dead weight.
# aws-lc-rs and dns-hickory are default's other two, kept: aws-lc-rs matches the
# provider src/main.rs installs, and dns-hickory is the resolver.
mail-auth = { version = "0.14", default-features = false, features = [
    "arc",
    "aws-lc-rs",
    "dns-hickory",
] }
mail-builder = "2.0"

# Networking
ipnetwork = "0.21"

# DNS
hickory-resolver = "0.26"

# HTTP API
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = "0.7"
reqwest = { version = "0.13", features = ["json", "query"] }

# OpenAPI documentation
utoipa = { version = "6", features = ["chrono", "uuid"] }
utoipa-scalar = { version = "0.4", features = ["axum"] }
# The /docs front-end bundle is embedded gzipped; this inflates it for
# clients that do not accept gzip.
flate2 = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Enum serialization
strum = { version = "0.28", features = ["derive"] }

# Database
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "uuid", "chrono", "json", "ipnetwork"] }

# KV store - rate limits, bans, greylisting, warmup counters. Any
# RESP-compatible server (Redis, Valkey, …) works. Selected by
# `[kv] backend` in config.toml.
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }

# Message queue (NATS / JetStream)
async-nats = "0.51"
futures = "0.3"

# Blob storage (S3-compatible: AWS S3, R2, B2, MinIO, SeaweedFS, Ceph, …)
aws-config = { version = "1", features = ["behavior-version-latest"] }
# default-features = false drops the "rustls" feature, which maps to
# aws-smithy-runtime/tls-rustls -> aws-smithy-http-client/legacy-rustls-ring
# and pins rustls 0.21 alongside the modern one. 0.21 is EOL and carries
# RUSTSEC-2026-0346/0349 with no fix on that line. "default-https-client"
# already provides HTTPS via rustls 0.23 (aws-lc), so the legacy stack was
# redundant. Everything else here is aws-sdk-s3's own default set.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-credential-types = "1"
aws-smithy-types = "1"

# Virus scanning
clamav-client = { version = "2.2", features = ["tokio-stream"] }

# Crypto
hex = "0.4"
hmac = "0.13"
sha2 = "0.11"
pbkdf2 = "0.13"
base64 = "0.23"
subtle = "2.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
argon2 = "0.6"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rsa = { version = "0.9", features = ["pkcs5"] }

# Random
rand = "0.10"

# Rate limiting
governor = "0.10"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Text processing
regex = "1"
url = "2"

# Byte handling
bytes = "1"
memchr = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# MCP
rmcp = { version = "3.1", features = ["server", "transport-io"] }
schemars = "1"

# Testing
rcgen = "0.14"
wiremock = "0.6"
testcontainers = "0.28"
tokio-test = "0.4"

# Internal crates
sentio-core = { path = "crates/sentio-core" }
sentio-smtp-server = { path = "crates/sentio-smtp-server" }
sentio-smtp-client = { path = "crates/sentio-smtp-client" }
sentio-auth = { path = "crates/sentio-auth" }
sentio-queue = { path = "crates/sentio-queue" }
sentio-api = { path = "crates/sentio-api" }
sentio-webhooks = { path = "crates/sentio-webhooks" }
sentio-llm = { path = "crates/sentio-llm" }
sentio-spam = { path = "crates/sentio-spam" }
sentio-abuse = { path = "crates/sentio-abuse" }
sentio-storage = { path = "crates/sentio-storage" }
sentio-store = { path = "crates/sentio-store" }
sentio-observe = { path = "crates/sentio-observe" }
